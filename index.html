<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthyBite Board</title>
  <meta name="description" content="Team board for the HealthyBite student marketing agency: 7-week plan, rotating roles, kanban, session timer and client tracking.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='34' r='24' fill='%232f7d4f'/><path d='M32 10c6-8 16-6 16-6s-2 10-12 12' fill='%23e9a23b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="35" r="23" fill="var(--green)"/><path d="M32 12c5-8 16-7 16-7s-1 11-12 12z" fill="var(--saffron)"/><path d="M22 36c4 6 16 6 20 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <div><b>HealthyBite</b><span id="tagline">Team board</span></div>
    </div>
    <div class="top-controls">
      <select id="week-select" aria-label="Week"></select>
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ar">ع</button>
      </div>
      <span id="sync" class="sync"></span>
    </div>
  </header>
  <nav id="nav" class="nav"></nav>
  <div class="rule-banner">🛡️ <span id="rule"></span></div>
  <main id="main" class="main"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
